// Executes the rest of lilith
exec lilith/modulehandling
exec lilith/functions
exec lilith/con_syntax

// the settings cfg may become obsolete with modules
exec lilith/settings
exec lilith/sfx

// Bind to toggle the menu (should have modules for this)
bind RSHIFT"lilith"

// Aliases for opening and closing the menu
alias runApp"developer 1;contimes 10000;con_notifytime 1800;exec lilith/ui/lilith"
alias exitApp"sfx.close;exec lilith/special/filterNone;exec lilith/reset;developer 0;contimes 8;con_notifytime 8;clear;alias lilith openLilith"

// Aliases for toggling the menu
alias lilith"openLilith"
alias openLilith"sfx.open;runApp;alias lilith closeLilith"
alias closeLilith"exitApp;alias lilith openLilith"

// Copies and modifies mastercomfig's class.cfg structure aliases
alias class_config_scout"exec overrides/scout.cfg"
alias class_config_soldier"exec overrides/soldier.cfg"
alias class_config_pyro"exec overrides/pyro.cfg"
alias class_config_demoman"exec overrides/demoman.cfg"
alias class_config_heavyweapons"exec overrides/heavyweapons.cfg"
alias class_config_engineer"exec overrides/engineer.cfg"
alias class_config_medic"exec overrides/medic.cfg"
alias class_config_sniper"exec overrides/sniper.cfg"
alias class_config_spy"exec overrides/spy.cfg"
alias run_game_overrides"exec lilith/game_overrides.cfg"
alias game_overrides_c"exec overrides/game_overrides.cfg"

// executing customizations
exec overrides/lilith_servers
exec overrides/lilith_modules
// executing modules
lilith_run_modules

// logo execution is now controlled by the lilithlogo module
lilithlogo