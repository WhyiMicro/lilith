// -----
// Mastercomfig normally handles class.cfg files, however to make some things work for standalone
// lilith while retaining compatibility with mastercomfig, we must hijack mastercomfig's and use
// them. Since these files will take priority over mastercomfig's, we must paste the same commands
// mastercomfig uses to ensure compatibility.
//
// NOTE: Please double-check these commands stay updated as mastercomfig gets new releases!
// -----
net_spy;snapshot_buffer
run_game_overrides
// If you want to apply commands for all classes see lilith/game_overrides.cfg
// Class-specific commands that DON'T override custom class.cfg go here

class_config_spy
// Class-specific commands that DO override custom class.cfg go here

exec app/spy.cfg

// Class-specific commands that DO override BOTH custom class.cfg and mastercomfig's app class.cfg go here (use wisely)
