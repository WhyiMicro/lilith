// -----
// This is a mastercomfig file, hijacked to make it work for lilith. It executes on every class
// swap, so if you have any commands that you want to run for every class then put them here.
// This file probably isn't necessary to entirely copy over from mastercomfig, but it'd be good
// to copy over just to keep code consistency and to keep lilith's custom commands all in one file.
//
// NOTE: Please double-check these commands stay updated as mastercomfig gets new releases!
// -----
setinfo cl_predict 1
voice_steal 2
snd_soundmixer Default_Mix
decals_clear
cmd demorestart
game_overrides_once
alias block_game_overrides_once"alias game_overrides_once;match_hud_alias2";block_game_overrides_once
game_overrides //unrelated to priority
// Commands that DON'T override custom game_overrides.cfg go here
doFlipHands; alias doFlipHands // for viewmodel flip function

game_overrides_c //executes custom game_overrides.cfg
// Commands that DO override custom game_overrides.cfg go here

exec app/game_overrides.cfg
// Commands that DO override BOTH custom game_overrides.cfg and mastercomfig's app game_overrides.cfg go here (use wisely)
