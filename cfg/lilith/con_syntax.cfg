//Creates cvar for the lilith command
setinfo lilith""

//Creates cvar and alias for reloading lilith
setinfo lilith_reload""
alias lilith_reload"exec lilith"

//Creates cvar and alias for showing the current version
setinfo lilith_version""
alias lilith_version"echo [Lilith] You're running version 1.3.0"

