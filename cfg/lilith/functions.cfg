// == Functions =======================================================================================================

// scripts.cfg functions
alias cjToggle"cjOn"
alias cjOn"bind space +cj;alias cjToggle cjOff"
alias cjOff"bind space +jump;alias cjToggle cjOn"
alias +cj"+jump;+duck"
alias -cj"-jump;-duck"

alias bhopToggle"bhopWarn"
alias bhopWarn"toggleconsole;echo [Lilith] This script will cap your fps at 66 and reconnect you to the server! You wont get this warning again. Toggle the script one more time to continue...;alias bhopToggle waitCheck;"
alias waitCheck"echo [Lilith] Running wait test...;alias waitTest waitPositive;wait;waitTest"
alias wait"alias waitTest waitNegative"
alias waitNegative"toggleconsole;echo [Lilith] This server has wait command disable. Bhop script wont work!"
alias waitPositive"bind SPACE +bhop;closeLilith;alias bhopToggle bhopReset;disconnect;fps_max 66;retry"
alias bhopReset"bind SPACE +jump;closeLilith;alias bhopToggle waitCheck;disconnect;fpscap;retry"
alias bhopBind"+jump;wait 2;-jump;wait 2;bhopJump"
alias bhopAlias"alias bhopJump bhopBind"
alias bhopStop"alias bhopJump"
alias +bhop"bhopAlias;bhopJump"
alias -bhop"bhopStop;-jump"

alias flipVmToggle"flipWarn"
alias flipWarn"toggleconsole;echo [Lilith] This script will reconnect you to the server! You wont get this warning again. Toggle the script one more time to continue...;alias flipVmToggle flipVm"
alias flipVm"disconnect;toggle cl_flipviewmodels;retry"

alias transVmToggle"exec lilith/special/mcomfigbypass"
alias transVmOn"mat_motion_blur_enabled 1;tf_contract_progress_show 1;tf_contract_competitive_show 1;alias transVmToggle transVmOff"
alias transVmOff"mat_motion_blur_enabled 0;tf_contract_progress_show 0;tf_contract_competitive_show 0;alias transVmToggle transVmOn"

// loadout.cfg functions
alias quickswitchToggle"quickswitchOn"
alias quickswitchOn"+quickswitch;alias quickswitchToggle quickswitchOff"
alias quickswitchOff"-quickswitch;alias quickswitchToggle quickswitchOn"

// crosshair.cfg functions
alias cycleXhair"xhair1"
alias xhair1"cl_crosshair_file crosshair1;alias cycleXhair xhair2"
alias xhair2"cl_crosshair_file crosshair2;alias cycleXhair xhair3"
alias xhair3"cl_crosshair_file crosshair3;alias cycleXhair xhair4"
alias xhair4"cl_crosshair_file crosshair4;alias cycleXhair xhair5"
alias xhair5"cl_crosshair_file crosshair5;alias cycleXhair xhair6"
alias xhair6"cl_crosshair_file crosshair6;alias cycleXhair xhair7"
alias xhair7"cl_crosshair_file crosshair7;alias cycleXhair xhair1"

alias rainbowXhairToggle"rainbowXhairOn"
alias rainbowXhairOn"exec lilith/special/rainbowXhair;alias rainbowXhairToggle rainbowXhairOff"
alias rainbowXhairOff"rainbowXhairReset;alias rainbowXhairToggle rainbowXhairOn"

alias rainbowXhairReset"bind w"+mf";bind s"+mb";bind a"+ml";bind d"+mr""

alias color"color1"
alias color1"cl_crosshair_red 0;cl_crosshair_green 255;cl_crosshair_blue 0;alias color color2"       // Green
alias color2"cl_crosshair_red 0;cl_crosshair_green 255;cl_crosshair_blue 255;alias color color3"     // Cyan
alias color3"cl_crosshair_red 0;cl_crosshair_green 0;cl_crosshair_blue 255;alias color color4"       // Blue
alias color4"cl_crosshair_red 255;cl_crosshair_green 255;cl_crosshair_blue 0;alias color color5"     // Yellow
alias color5"cl_crosshair_red 255;cl_crosshair_green 0;cl_crosshair_blue 255;alias color color6"     // Purple
alias color6"cl_crosshair_red 255;cl_crosshair_green 0;cl_crosshair_blue 0;alias color color1"       // Red

alias +mf"-back;+forward;alias cf +forward"
alias +mb"-forward;+back;alias cb +back"
alias +ml"-moveright;+moveleft;alias cl +moveleft"
alias +mr"-moveleft;+moveright;alias cr +moveright"
alias -mf"-forward;cb;alias cf"
alias -mb"-back;cf;alias cb"
alias -ml"-moveleft;cr;alias cl"
alias -mr"-moveright;cl;alias cr"
alias cf
alias cb
alias cl
alias cr

