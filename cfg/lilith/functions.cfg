// scripts.cfg functions
alias crouchJumpToggle"crouchJump=on"
alias crouchJump=on"bind space +cj;alias crouchJumpToggle crouchJump=off"
alias crouchJump=off"bind space +jump;alias crouchJumpToggle crouchJump=on"
alias +cj"+jump;+duck"
alias -cj"-jump;-duck"

alias bhopToggle"waitCheck"
alias waitCheck"alias waitTest waitPositive;wait;waitTest"
alias wait"alias waitTest waitNegative"
alias waitPositive"bhopWarning"
alias waitNegative"toggleconsole;echo [Lilith] This server doesnt support wait commands. Bhop script wont work!"
alias bhopWarning"toggleconsole;echo [Lilith] This script will reconnect you to the server and while you use it, it will cap your fps to 66!;bhopWarning1"
alias bhopWarning1"echo [Lilith] Type [Y]es to continue or [N]o to cancel. You wont get this warning next time!;exec lilith/special/tempAlias"
alias continue"bhop=on;echo [Lilith] Executing...;exec lilith/special/resetAlias"
alias break"echo [Lilith] Not executing!;exec lilith/special/resetAlias"
alias bhop=on"bind SPACE +bhop;closeLilith;alias bhopToggle bhop=off;disconnect;fps_max 66;retry"
alias bhop=off"bind SPACE +jump;closeLilith;alias bhopToggle waitCheck;disconnect;fps_max 245;retry"
alias bhopBind"+jump;wait 2;-jump;wait 2;bhopJump"
alias bhopAlias"alias bhopJump bhopBind"
alias bhopStop"alias bhopJump"
alias +bhop"bhopAlias;bhopJump"
alias -bhop"bhopStop;-jump"

alias flipViewmodelToggle"flipWarning"
alias flipWarning"toggleconsole;echo [Lilith] This script will reconnect you to the server! Toggle the script one more time to continue...;flipWarning1"
alias flipWarning1"echo [Lilith] You wont get this warning next time!;alias flipViewmodelToggle flipViewmodel"
alias flipViewmodel"disconnect;toggle cl_flipviewmodels;retry"


alias transparentViewmodelsToggle"exec lilith/special/mcomfigbypass"
alias transVM=on"mat_motion_blur_enabled 1;tf_contract_progress_show 1;tf_contract_competitive_show 1;alias transparentViewmodelsToggle transVM=off"
alias transVM=off"mat_motion_blur_enabled 0;tf_contract_progress_show 0;tf_contract_competitive_show 0;alias transparentViewmodelsToggle transVM=on"

// loadout.cfg functions
alias toggleQuickswitch"quickswitch=on"
alias quickswitch=on"+quickswitch;alias toggleQuickswitch quickswitch=off"
alias quickswitch=off"-quickswitch;alias toggleQuickswitch quickswitch=on"

// pointer.cfg functions
alias cycleCrosshair"crosshair=0"
alias crosshair=0"exec lilith/special/crosshairNone;alias cycleCrosshair crosshair=1"
alias crosshair=1"cl_crosshair_file crosshair1;alias cycleCrosshair crosshair=2"
alias crosshair=2"cl_crosshair_file crosshair2;alias cycleCrosshair crosshair=3"
alias crosshair=3"cl_crosshair_file crosshair3;alias cycleCrosshair crosshair=4"
alias crosshair=4"cl_crosshair_file crosshair4;alias cycleCrosshair crosshair=5"
alias crosshair=5"cl_crosshair_file crosshair5;alias cycleCrosshair crosshair=6"
alias crosshair=6"cl_crosshair_file crosshair6;alias cycleCrosshair crosshair=7"
alias crosshair=7"cl_crosshair_file crosshair7;alias cycleCrosshair crosshair=0"

alias toggleRainbowCrosshair"rainbowCrosshair=on"
alias rainbowCrosshair=on"exec lilith/special/rainbowCrosshair;alias toggleRainbowCrosshair rainbowCrosshair=off"
alias rainbowCrosshair=off"exec lilith/special/null;alias toggleRainbowCrosshair rainbowCrosshair=on"

