// -----
// Lilith's own modules; any module here overrides mastercomfig's modules
// we can figure out better names and methods of handling modules later, but this is here as a base
//
// these modules copy how mastercomfig handles modules for the sake of proper integration
// 
//
// REMINDER: for modules that do the same thing as one of mastercomfig's modules, don't forget
// to properly integrate with mastercomfig's modules aliases as well!
// -----

// another two mastercomfig aliases hijacked; don't forget to update the lilith/module_levels.cfg file as modules are added
alias module_levels"exec lilith/module_levels"
setinfo module_levels""
alias run_modules"exec comfig/modules_run.cfg;lilith_run_modules"
setinfo run_modules""

// we can expand this alias to a config file if it gets too large (unlikely)
// the lilithlogo module is purposely omitted from the lilith_run_modules alias since it'll be put in cfg/lilith.cfg
alias lilith_run_modules"fpscap;viewmodelposition;movement"

// fpscap module; by default sets to 1000
// hopefully we can refine this a bit more than just copying mastercomfig's modules, maybe include a setfpscap module
// or something, idk
alias fpscap_powersaver"mat_powersavingsmode 1;alias fpscap_level echo fpscap=powersaver;setinfo fpscap powersaver"
alias fpscap_30"mat_powersavingsmode 0;fps_max 30;alias fpscap_level echo fpscap=30;setinfo fpscap 30"
alias fpscap_60"mat_powersavingsmode 0;fps_max 60;alias fpscap_level echo fpscap=60;setinfo fpscap 60"
alias fpscap_75"mat_powersavingsmode 0;fps_max 75;alias fpscap_level echo fpscap=75;setinfo fpscap 75"
alias fpscap_120"mat_powersavingsmode 0;fps_max 120;alias fpscap_level echo fpscap=120;setinfo fpscap 120"
alias fpscap_144"mat_powersavingsmode 0;fps_max 144;alias fpscap_level echo fpscap=144;setinfo fpscap 144"
alias fpscap_160"mat_powersavingsmode 0;fps_max 160;alias fpscap_level echo fpscap=160;setinfo fpscap 160"
alias fpscap_165"mat_powersavingsmode 0;fps_max 165;alias fpscap_level echo fpscap=165;setinfo fpscap 165"
alias fpscap_180"mat_powersavingsmode 0;fps_max 180;alias fpscap_level echo fpscap=180;setinfo fpscap 165"
alias fpscap_200"mat_powersavingsmode 0;fps_max 200;alias fpscap_level echo fpscap=200;setinfo fpscap 180"
alias fpscap_240"mat_powersavingsmode 0;fps_max 240;alias fpscap_level echo fpscap=240;setinfo fpscap 240"
alias fpscap_300"mat_powersavingsmode 0;fps_max 300;alias fpscap_level echo fpscap=300;setinfo fpscap 300"
alias fpscap_360"mat_powersavingsmode 0;fps_max 360;alias fpscap_level echo fpscap=360;setinfo fpscap 360"
alias fpscap_390"mat_powersavingsmode 0;fps_max 390;alias fpscap_level echo fpscap=360;setinfo fpscap 390"
alias fpscap_400"mat_powersavingsmode 0;fps_max 400;alias fpscap_level echo fpscap=400;setinfo fpscap 400"
alias fpscap_500"mat_powersavingsmode 0;fps_max 500;alias fpscap_level echo fpscap=500;setinfo fpscap 500"
alias fpscap_800"mat_powersavingsmode 0;fps_max 800;alias fpscap_level echo fpscap=800;setinfo fpscap 800"
alias fpscap_1000"mat_powersavingsmode 0;fps_max 1000;alias fpscap_level echo fpscap=1000;setinfo fpscap 1000"
alias fpscap_off"mat_powersavingsmode 0;fps_max 0;alias fpscap_level echo fpscap=unlimited;setinfo fpscap off"
alias fpscap_unlimited"fpscap_off"
alias fpscap=powersaver"alias fpscap fpscap_powersaver;setinfo fpscap powersaver-pending"
alias fpscap=30"alias fpscap fpscap_30;setinfo fpscap 30-pending"
alias fpscap=60"alias fpscap fpscap_60;setinfo fpscap 60-pending"
alias fpscap=75"alias fpscap fpscap_75;setinfo fpscap 75-pending"
alias fpscap=120"alias fpscap fpscap_120;setinfo fpscap 120-pending"
alias fpscap=144"alias fpscap fpscap_144;setinfo fpscap 144-pending"
alias fpscap=160"alias fpscap fpscap_160;setinfo fpscap 160-pending"
alias fpscap=165"alias fpscap fpscap_165;setinfo fpscap 165-pending"
alias fpscap=180"alias fpscap fpscap_180;setinfo fpscap 180-pending"
alias fpscap=200"alias fpscap fpscap_200;setinfo fpscap 200-pending"
alias fpscap=240"alias fpscap fpscap_240;setinfo fpscap 240-pending"
alias fpscap=300"alias fpscap fpscap_300;setinfo fpscap 300-pending"
alias fpscap=360"alias fpscap fpscap_360;setinfo fpscap 360-pending"
alias fpscap=390"alias fpscap fpscap_390;setinfo fpscap 390-pending"
alias fpscap=400"alias fpscap fpscap_400;setinfo fpscap 400-pending"
alias fpscap=500"alias fpscap fpscap_500;setinfo fpscap 500-pending"
alias fpscap=800"alias fpscap fpscap_800;setinfo fpscap 800-pending"
alias fpscap=1000"alias fpscap fpscap_1000;setinfo fpscap 1000-pending"
alias fpscap=off"alias fpscap fpscap_off;setinfo fpscap off-pending"
alias fpscap=unlimited"fpscap=off"

// viewmodelposition module; by default sets to right
// this may cause some demo recording stops in odd use cases
alias viewmodelposition_right"alias flipVMToggle flipHands_R;flipVMToggle;alias viewmodelposition_level echo viewmodelposition=right;setinfo viewmodelposition right"
alias viewmodelposition_left"alias flipVMToggle flipHands_L;flipVMToggle;alias viewmodelposition_level echo viewmodelposition=left;setinfo viewmodelposition left"
alias viewmodelposition=right"alias viewmodelposition viewmodelposition_right;setinfo viewmodelposition right-pending"
alias viewmodelposition=left"alias viewmodelposition viewmodelposition_left;setinfo viewmodelposition left-pending"

// lilithlogo module; by default sets to on
alias lilithlogo_on"exec lilith/logo;alias lilithlogo_level echo lilithlogo=on;setinfo lilithlogo on"
alias lilithlogo_off"alias lilithlogo_level echo lilithlogo=off;setinfo lilithlogo off"
alias lilithlogo=on"alias lilithlogo lilithlogo_on;setinfo lilithlogo on-pending"
alias lilithlogo=off"alias lilithlogo lilithlogo_off;setinfo lilithlogo off-pending"

// movement module; by default set to normal
alias movement_normal"bind w "+forward";bind a "0moveleft";bind s "+back";bind d "+moveright";alias movement_level echo movement=normal;setinfo movement normal"
alias movement_null"bind w"+mf";bind s"+mb";bind a"+ml";bind d"+mr";alias movement_level echo movement=null;setinfo movement null"
alias movement=normal"alias movement movement_normal;setinfo movement normal-pending"
alias movement=null"alias movement movement_null;setinfo movement null-pending"


// setting defaults
fpscap=1000
viewmodelposition=right
lilithlogo=on
movement=normal

// execution of modules is located within \cfg\lilith.cfg
// should probably figure out a better method of execution, it doesn't flow well