// -----
// Lilith's own modules; any module here overrides mastercomfig's modules
// we can figure out better names and methods of handling modules later, but this is here as a base
//
// these modules copy how mastercomfig handles modules for the sake of proper integration
// 
//
// REMINDER: for modules that do the same thing as one of mastercomfig's modules, don't forget
// to properly integrate with mastercomfig's modules aliases as well!
// -----

// another two mastercomfig aliases hijacked; don't forget to update the lilith/module_levels.cfg file as modules are added
alias module_levels"exec lilith/module_levels"
alias run_modules"exec comfig/modules_run.cfg;lilith_run_modules"

// we can expand this alias to a config file if it gets too large (unlikely)
// the lilithlogo module is purposely omitted from the lilith_run_modules alias since it'll be put in cfg/lilith.cfg
alias lilith_run_modules"fpscap;viewmodelposition;movement"

// fpscap module; by default sets to 1000
// hopefully we can refine this a bit more than just copying mastercomfig's modules, maybe include a setfpscap module
// or something, idk
alias fpscap_powersaver"mat_powersavingsmode 1;alias fpscap_level echo fpscap=powersaver"
alias fpscap_30"mat_powersavingsmode 0;fps_max 30;alias fpscap_level echo fpscap=30"
alias fpscap_60"mat_powersavingsmode 0;fps_max 60;alias fpscap_level echo fpscap=60"
alias fpscap_75"mat_powersavingsmode 0;fps_max 75;alias fpscap_level echo fpscap=75"
alias fpscap_120"mat_powersavingsmode 0;fps_max 120;alias fpscap_level echo fpscap=120"
alias fpscap_144"mat_powersavingsmode 0;fps_max 144;alias fpscap_level echo fpscap=144"
alias fpscap_160"mat_powersavingsmode 0;fps_max 160;alias fpscap_level echo fpscap=160"
alias fpscap_165"mat_powersavingsmode 0;fps_max 165;alias fpscap_level echo fpscap=165"
alias fpscap_180"mat_powersavingsmode 0;fps_max 180;alias fpscap_level echo fpscap=180"
alias fpscap_200"mat_powersavingsmode 0;fps_max 200;alias fpscap_level echo fpscap=200"
alias fpscap_240"mat_powersavingsmode 0;fps_max 240;alias fpscap_level echo fpscap=240"
alias fpscap_300"mat_powersavingsmode 0;fps_max 300;alias fpscap_level echo fpscap=300"
alias fpscap_360"mat_powersavingsmode 0;fps_max 360;alias fpscap_level echo fpscap=360"
alias fpscap_390"mat_powersavingsmode 0;fps_max 390;alias fpscap_level echo fpscap=360"
alias fpscap_400"mat_powersavingsmode 0;fps_max 400;alias fpscap_level echo fpscap=400"
alias fpscap_500"mat_powersavingsmode 0;fps_max 500;alias fpscap_level echo fpscap=500"
alias fpscap_800"mat_powersavingsmode 0;fps_max 800;alias fpscap_level echo fpscap=800"
alias fpscap_1000"mat_powersavingsmode 0;fps_max 1000;alias fpscap_level echo fpscap=1000"
alias fpscap_off"mat_powersavingsmode 0;fps_max 0;alias fpscap_level echo fpscap=unlimited"
alias fpscap_unlimited"fpscap_off"
alias fpscap=powersaver"alias fpscap fpscap_powersaver"
alias fpscap=30"alias fpscap fpscap_30"
alias fpscap=60"alias fpscap fpscap_60"
alias fpscap=75"alias fpscap fpscap_75"
alias fpscap=120"alias fpscap fpscap_120"
alias fpscap=144"alias fpscap fpscap_144"
alias fpscap=160"alias fpscap fpscap_160"
alias fpscap=165"alias fpscap fpscap_165"
alias fpscap=180"alias fpscap fpscap_180"
alias fpscap=200"alias fpscap fpscap_200"
alias fpscap=240"alias fpscap fpscap_240"
alias fpscap=300"alias fpscap fpscap_300"
alias fpscap=360"alias fpscap fpscap_360"
alias fpscap=390"alias fpscap fpscap_390"
alias fpscap=400"alias fpscap fpscap_400"
alias fpscap=500"alias fpscap fpscap_500"
alias fpscap=800"alias fpscap fpscap_800"
alias fpscap=1000"alias fpscap fpscap_1000"
alias fpscap=off"alias fpscap fpscap_off"
alias fpscap=unlimited"fpscap=off"

// viewmodelposition module; by default set to right
// this may cause some demo recording stops in odd use cases
alias viewmodelposition_right"alias flipVMToggle flipHands_R;flipVMToggle;alias viewmodelposition_level echo viewmodelposition=right"
alias viewmodelposition_left"alias flipVMToggle flipHands_L;flipVMToggle;alias viewmodelposition_level echo viewmodelposition=left"
alias viewmodelposition=right"alias viewmodelposition viewmodelposition_right"
alias viewmodelposition=left"alias viewmodelposition viewmodelposition_left"

// lilithlogo module; by default set to on
alias lilithlogo_on"exec lilith/logo;alias lilithlogo_level echo lilithlogo=on"
alias lilithlogo_off"alias lilithlogo_level echo lilithlogo=off"
alias lilithlogo=on"alias lilithlogo lilithlogo_on"
alias lilithlogo=off"alias lilithlogo lilithlogo_off"

// !!! If you're using null addon on mcomfig, this will override it, needs fixing - iMicro
// movement module; by default set to normal
// todo: have this be incorporated with a movement-binds setting of some sort (mastercomfig has a module that controls that)
//       make the rainbowXhairToggle use the type of movement the module is set to instead of null by default
alias movement_normal"bind w "+forward";bind a "+moveleft";bind s "+back";bind d "+moveright";alias movement_level echo movement=normal"
alias movement_null"bind w "+mf";bind s "+mb";bind a "+ml";bind d "+mr";alias movement_level echo movement=null"
alias movement=normal"alias movement movement_normal"
alias movement=null"alias movement movement_null"


// setting defaults
fpscap=1000
viewmodelposition=right
lilithlogo=on
movement=normal

// execution of modules is located within \cfg\lilith.cfg
// should probably figure out a better method of execution, it doesn't flow well
// maybe make a dubug module for development? (wouldn't clear console and would spew more info)