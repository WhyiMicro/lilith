exec lilith/functions
exec lilith/con_syntax

con_filter_enable 2
con_filter_text ""
con_filter_text_out ""
fps_max 245

bind RSHIFT"lilith"

alias exitApp"exec lilith/special/filterNone;exec lilith/reset;developer 0;contimes 8;con_notifytime 8;alias lilith openLilith"
alias runApp"developer 1;contimes 10000;con_notifytime 1800;exec lilith/ui/lilith"

alias lilith"openLilith"
alias openLilith"runApp;alias lilith closeLilith"
alias closeLilith"exitApp;alias lilith openLilith"

exec lilith/finalize