// Executes the rest of lilith
exec lilith/functions
exec lilith/con_syntax
exec lilith/special/null
exec lilith/settings
exec lilith/sfx

// Bind to toggle the menu (should have modules for this)
bind RSHIFT"lilith"

// Aliases for opening and closing the menu
alias runApp"developer 1;contimes 10000;con_notifytime 1800;exec lilith/ui/lilith"
alias exitApp"sfx.close;exec lilith/special/filterNone;exec lilith/reset;developer 0;contimes 8;con_notifytime 8;alias lilith openLilith"

// Aliases for toggling the menu
alias lilith"openLilith"
alias openLilith"sfx.open;runApp;alias lilith closeLilith"
alias closeLilith"exitApp;alias lilith openLilith"

// Executes the flower logo on startup
exec lilith/logo