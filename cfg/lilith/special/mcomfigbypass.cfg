// Make sure to create a better solution for this in the future
// Commands set to ensure transparent viewmodels will work
mat_hdr_level 0
mat_colorcorrection 0
mat_colcorrection_disableentities 1
r_bloomtintr .333
r_bloomtintg .333
r_bloomtintb .333
r_bloomtintexponent 1
mat_motion_blur_enabled 1
mat_motion_blur_strength 0
mat_alphacoverage 0
mat_antialias 1

// Mastercomfig compatibility
post_processing_off
alias motion_blur motion_blur_refract
motion_blur
anti_aliasing_off

// Script
alias transparentViewmodelsToggle transVM=on
transparentViewmodelsToggle