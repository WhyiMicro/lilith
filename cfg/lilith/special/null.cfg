// Script which prevents pressing two movement keys of opposite directions from stopping movement
// Maybe make customizing the null-movement keys a module too (this is becoming mastercomfig v2)
bind w"+mf"
bind s"+mb"
bind a"+ml"
bind d"+mr"

// WARNING: Incompatibility with the rainbow-crosshair script as they both modify the same aliases!
alias +mf"-back;+forward;alias cf +forward"
alias +mb"-forward;+back;alias cb +back"
alias +ml"-moveright;+moveleft;alias cl +moveleft"
alias +mr"-moveleft;+moveright;alias cr +moveright"
alias -mf"-forward;cb;alias cf"
alias -mb"-back;cf;alias cb"
alias -ml"-moveleft;cr;alias cl"
alias -mr"-moveright;cl;alias cr"
alias cf
alias cb
alias cl
alias cr